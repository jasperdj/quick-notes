<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>folded - Advanced Markdown Editor</title>
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">folded</h1>
            </div>
            <div class="header-center">
                <span id="document-name">Untitled</span>
            </div>
            <div class="header-right">
                <span id="save-indicator" class="save-indicator"></span>
            </div>
        </header>

        <main class="editor-container">
            <!-- CodeMirror 6 will mount here -->
        </main>

        <footer class="footer">
            <div class="footer-left">
                <span id="line-count">0 lines</span>
            </div>
            <div class="footer-center">
                <span id="cursor-pos">Ln 1, Col 1</span>
            </div>
            <div class="footer-right">
                <span id="mode-indicator">Edit</span>
            </div>
        </footer>
    </div>

    <script type="module" src="/main.ts"></script>
</body>
</html>
